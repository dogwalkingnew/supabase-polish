name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: TypeScript, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint application code
        run: pnpm run lint

      - name: Production build
        run: pnpm run build

      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm run audit:prod; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Audit npm indisponible ou échoué, nouvelle tentative dans 15 secondes (tentative $((attempt + 1))/3)."
              sleep 15
            fi
          done
          exit 1
